services:
  postgres:
    image: postgres:16
    container_name: trade-optimizer-postgres
    environment:
      POSTGRES_DB: tradeopt
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - tradeopt_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tradeopt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tradeopt_data: